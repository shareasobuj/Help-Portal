<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHub | ১০০% কার্যকর সাহায্য কেন্দ্র</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-2xl font-bold flex items-center gap-2 cursor-pointer" onclick="showPage('homePage')">
                <i class="fas fa-hand-holding-heart"></i> HelpHub
            </div>
            <div class="flex items-center gap-4">
                <span id="visitorDisplay" class="bg-blue-800 px-3 py-1 rounded-full text-xs">ভিজিটর: ০</span>
                <div id="navAuthLinks">
                    </div>
            </div>
        </div>
    </nav>

    <section id="homePage" class="page-section py-20 text-center bg-white">
        <h1 class="text-5xl font-bold text-gray-800 mb-6">মানুষ মানুষের জন্য</h1>
        <p class="text-xl text-gray-600 mb-10">আপনার একটি ছোট দান কারো জীবনের বড় পরিবর্তন আনতে পারে।</p>
        <button onclick="showPage('loginPage')" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold text-lg hover:bg-blue-700 transition">এখনই শুরু করুন</button>
    </section>

    <section id="loginPage" class="page-section hidden-section py-10">
        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">অ্যাকাউন্টে প্রবেশ করুন</h2>
            <div class="space-y-4">
                <button onclick="handleGoogleLogin()" class="w-full border py-3 rounded-xl flex justify-center items-center gap-3 hover:bg-gray-50 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> গুগল দিয়ে লগইন করুন
                </button>
                <p class="text-center text-gray-400">বা সরাসরি ড্যাশবোর্ড দেখুন</p>
            </div>
        </div>
    </section>

    <section id="dashboardPage" class="page-section hidden-section py-8 max-w-6xl mx-auto px-4">
        <div class="grid md:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow h-fit">
                <h3 class="text-xl font-bold mb-4">নতুন পোস্ট</h3>
                <select id="postType" class="w-full p-3 border rounded-xl mb-4 outline-none">
                    <option value="donor">আমি সাহায্য দিতে চাই (Donor)</option>
                    <option value="receiver">আমার সাহায্য প্রয়োজন (Receiver)</option>
                </select>
                <textarea id="postMsg" rows="4" class="w-full p-3 border rounded-xl mb-4 outline-none" placeholder="আপনার বিস্তারিত লিখুন..."></textarea>
                <button onclick="submitPost()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition">পোস্ট করুন</button>
            </div>

            <div class="md:col-span-2">
                <div id="postFeed" class="space-y-4">
                    </div>
            </div>
        </div>
    </section>

    <script type="module" src="app.js"></script>
    <script>
        // পেজ পরিবর্তন করার ফাংশন
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(section => {
                section.classList.add('hidden-section');
            });
            document.getElementById(pageId).classList.remove('hidden-section');
        }
        window.showPage = showPage;
    </script>
</body>
</html>
